<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-label="Cuatro bloques en cascada: plan de calidad (define el requerido), control interno propio (vigila el día a día), comparación entre pares (contraste y lotes nuevos) y evaluación externa (prueba ciega del proceso completo)" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
<rect x="0" y="0" width="640" height="470" rx="10" fill="#FFFFFF" stroke="#E2D5DB"/>
<rect x="20" y="20" width="600" height="78" rx="10" fill="#6D0F2B" fill-opacity="1"/>
<circle cx="62" cy="59" r="20" fill="#FFFFFF"/>
<text x="62" y="66" font-size="20" fill="#6D0F2B" text-anchor="middle" font-weight="700">1</text>
<text x="100" y="54" font-size="18" fill="#FFFFFF" text-anchor="start" font-weight="700">Plan de calidad (tuyo)</text>
<text x="100" y="78" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="400">Define el requerido por analito y lo justifica</text>
<polygon points="310,104 330,104 320,118" fill="#6B6166"/>
<rect x="20" y="120" width="600" height="78" rx="10" fill="#F6EEF1" fill-opacity="1" stroke="#6D0F2B"/>
<circle cx="62" cy="159" r="20" fill="#6D0F2B"/>
<text x="62" y="166" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="100" y="154" font-size="18" fill="#2A2226" text-anchor="start" font-weight="700">Control interno propio</text>
<text x="100" y="178" font-size="14" fill="#2A2226" text-anchor="start" font-weight="400">Vigila el día a día con reglas diseñadas para ese requerido</text>
<polygon points="310,204 330,204 320,218" fill="#6B6166"/>
<rect x="20" y="220" width="600" height="78" rx="10" fill="#F6EEF1" fill-opacity="1" stroke="#6D0F2B"/>
<circle cx="62" cy="259" r="20" fill="#6D0F2B"/>
<text x="62" y="266" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="100" y="254" font-size="18" fill="#2A2226" text-anchor="start" font-weight="700">Comparación entre pares</text>
<text x="100" y="278" font-size="14" fill="#2A2226" text-anchor="start" font-weight="400">Contraste con el grupo, lotes nuevos y detección de deriva</text>
<polygon points="310,304 330,304 320,318" fill="#6B6166"/>
<rect x="20" y="320" width="600" height="78" rx="10" fill="#F6EEF1" fill-opacity="1" stroke="#6D0F2B"/>
<circle cx="62" cy="359" r="20" fill="#6D0F2B"/>
<text x="62" y="366" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="100" y="354" font-size="18" fill="#2A2226" text-anchor="start" font-weight="700">Evaluación externa</text>
<text x="100" y="378" font-size="14" fill="#2A2226" text-anchor="start" font-weight="400">Prueba ciega del proceso completo, con otro valor de referencia</text>
<text x="320" y="438" font-size="15" fill="#6D0F2B" text-anchor="middle" font-weight="600">Si las vías discrepan, investiga: la diferencia suele tener causa.</text>
<text x="320" y="457" font-size="14" fill="#6B6166" text-anchor="middle" font-weight="400">La meta la fija el bloque 1; los demás aportan evidencia.</text>
</svg>
