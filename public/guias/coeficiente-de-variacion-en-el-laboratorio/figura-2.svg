<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-label="Dos reglas de HbA1c con ceros distintos: la misma DE da un CV de 2,3 % en NGSP y de 3,5 % en IFCC" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
<rect x="0" y="0" width="640" height="390" rx="10" fill="#FFFFFF" stroke="#E2D5DB"/>
<text x="50.0" y="28.0" font-size="15" fill="#6D0F2B" text-anchor="start" font-weight="600">Escala NGSP (%)</text>
<line x1="50.0" y1="66.0" x2="600.0" y2="66.0" stroke="#6D0F2B" stroke-width="2.5"/>
<line x1="50.0" y1="60.0" x2="50.0" y2="72.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="50.0" y="54.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">0</text>
<line x1="118.8" y1="60.0" x2="118.8" y2="72.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="118.8" y="54.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">1</text>
<line x1="187.5" y1="60.0" x2="187.5" y2="72.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="187.5" y="54.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">2</text>
<line x1="256.2" y1="60.0" x2="256.2" y2="72.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="256.2" y="54.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">3</text>
<line x1="325.0" y1="60.0" x2="325.0" y2="72.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="325.0" y="54.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">4</text>
<line x1="393.8" y1="60.0" x2="393.8" y2="72.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="393.8" y="54.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">5</text>
<line x1="462.5" y1="60.0" x2="462.5" y2="72.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="462.5" y="54.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">6</text>
<line x1="531.2" y1="60.0" x2="531.2" y2="72.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="531.2" y="54.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">7</text>
<line x1="600.0" y1="60.0" x2="600.0" y2="72.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="600.0" y="54.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">8</text>
<text x="50.0" y="90.0" font-size="13" fill="#6D0F2B" text-anchor="middle" font-weight="400">cero NGSP</text>
<text x="50.0" y="168.0" font-size="15" fill="#1F5F7A" text-anchor="start" font-weight="600">Escala IFCC (mmol/mol)</text>
<line x1="198.0" y1="215.0" x2="575.3" y2="215.0" stroke="#1F5F7A" stroke-width="2.5"/>
<line x1="198.0" y1="209.0" x2="198.0" y2="221.0" stroke="#1F5F7A" stroke-width="2"/>
<text x="198.0" y="239.0" font-size="13" fill="#1F5F7A" text-anchor="middle" font-weight="400">0</text>
<line x1="260.8" y1="209.0" x2="260.8" y2="221.0" stroke="#1F5F7A" stroke-width="2"/>
<text x="260.8" y="239.0" font-size="13" fill="#1F5F7A" text-anchor="middle" font-weight="400">10</text>
<line x1="323.7" y1="209.0" x2="323.7" y2="221.0" stroke="#1F5F7A" stroke-width="2"/>
<text x="323.7" y="239.0" font-size="13" fill="#1F5F7A" text-anchor="middle" font-weight="400">20</text>
<line x1="386.6" y1="209.0" x2="386.6" y2="221.0" stroke="#1F5F7A" stroke-width="2"/>
<text x="386.6" y="239.0" font-size="13" fill="#1F5F7A" text-anchor="middle" font-weight="400">30</text>
<line x1="449.5" y1="209.0" x2="449.5" y2="221.0" stroke="#1F5F7A" stroke-width="2"/>
<text x="449.5" y="239.0" font-size="13" fill="#1F5F7A" text-anchor="middle" font-weight="400">40</text>
<line x1="512.4" y1="209.0" x2="512.4" y2="221.0" stroke="#1F5F7A" stroke-width="2"/>
<text x="512.4" y="239.0" font-size="13" fill="#1F5F7A" text-anchor="middle" font-weight="400">50</text>
<line x1="575.3" y1="209.0" x2="575.3" y2="221.0" stroke="#1F5F7A" stroke-width="2"/>
<text x="575.3" y="239.0" font-size="13" fill="#1F5F7A" text-anchor="middle" font-weight="400">60</text>
<text x="198.0" y="201.0" font-size="13" fill="#1F5F7A" text-anchor="middle" font-weight="400">cero IFCC</text>
<line x1="496.9" y1="66.0" x2="496.9" y2="215.0" stroke="#6B6166" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="486.6" y="63.0" width="20.6" height="6.0" fill="#6D0F2B" fill-opacity="1"/>
<rect x="486.6" y="212.0" width="20.6" height="6.0" fill="#1F5F7A" fill-opacity="1"/>
<line x1="50.0" y1="110.0" x2="496.9" y2="110.0" stroke="#6D0F2B" stroke-width="2"/>
<text x="273.4" y="132.0" font-size="14" fill="#6D0F2B" text-anchor="middle" font-weight="400">6,5 desde el cero NGSP hasta la media</text>
<line x1="198.0" y1="263.0" x2="496.9" y2="263.0" stroke="#1F5F7A" stroke-width="2"/>
<text x="327.4" y="285.0" font-size="14" fill="#1F5F7A" text-anchor="middle" font-weight="400">4,35 desde el cero IFCC hasta la media</text>
<text x="50.0" y="330.0" font-size="16" fill="#6D0F2B" text-anchor="start" font-weight="600">CV en NGSP = 0,15 ÷ 6,5 = 2,3 %</text>
<text x="600.0" y="330.0" font-size="16" fill="#1F5F7A" text-anchor="end" font-weight="600">CV en IFCC = 0,15 ÷ 4,35 = 3,5 %</text>
<text x="320.0" y="370.0" font-size="14" fill="#6B6166" text-anchor="middle" font-weight="400">La DE (0,15) es la misma en las dos reglas; cambia la distancia desde el cero.</text>
</svg>
