# Publica el sitio en GitHub Pages cada vez que se sube un cambio a la rama main.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fin de la preventa: recompila el sitio la madrugada del 1 de diciembre de 2026 (Chile: UTC-3) para que se publique con precios
  # normales sin hacer nada a mano. Dos horarios por si GitHub retrasa o pierde uno; el segundo es inofensivo.
  schedule:
    - cron: '10 3 1 12 *'
    - cron: '40 6 1 12 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Probar las fórmulas
        run: npm test
      - name: Compilar el sitio (valida las fichas)
        run: npm run build
      - name: Revisar enlaces y metadatos
        run: npm run enlaces
      - name: Empaquetar para Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
